[workspace]
resolver = "2"
# Add each crate here as it is written (e.g. "crates/primitives", "crates/modules/bank").
# Planned layout: TODO.md, Phase 1.
members = [
    "crates/interface",
    "crates/primitives",
]
# The SP1 guest is built with the SP1 toolchain, not as part of this workspace.
exclude = ["zk/sp1-guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Selendra"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
non_ascii_idents = "deny" # Bad for readability and a homoglyph attack vector
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
inefficient_to_string = "deny"
map_flatten = "deny"
manual_ok_or = "deny"
doc_link_with_quotes = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
float_arithmetic = "deny"     # Native and zkVM execution must agree bit-for-bit
dbg_macro = "deny"
todo = "deny"
mem_forget = "deny"

[workspace.dependencies]
# Add `selendra-<name> = { path = "crates/<name>", default-features = false }` with each new crate.
selendra-interface = { path = "crates/interface", default-features = false }
selendra-primitives = { path = "crates/primitives", default-features = false }

# Use the newest releases. Exception: crates whose output is consensus-critical (encoding,
# hashing, EVM) are pinned exactly (`=x.y.z`) and only upgraded deliberately.
anyhow = "1.0.95"
arbitrary = { version = "1.3.2", features = ["derive"] }
async-trait = "0.1.81"
backon = { version = "1.5.1", default-features = false, features = ["tokio-sleep"] }
borsh = { version = "=1.8.1", features = ["derive"] } # consensus-critical encoding: exact pin
bytes = { version = "1.10", default-features = false }
derive_more = { version = "2.0", default-features = false, features = ["std"] }
# zkVM-patched: SP1 6.x guest patches exact versions. Upgrade only together with the SP1 patches.
digest = { version = "0.10.7", default-features = false, features = ["alloc"] }
ed25519-consensus = { version = "=2.1.0", default-features = false, features = ["std"] }
hex = "0.4.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = { version = "1.5", default-features = false, features = ["std", "alloc"] }
proptest-derive = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] } # ed25519-consensus 2.1 uses rand_core 0.6
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0.208", default-features = false, features = ["alloc", "derive"] }
serde_with = { version = "3", default-features = false, features = ["alloc", "base64", "macros"] }
sha2 = { version = "=0.10.9", default-features = false } # zkVM-patched (SP1), see digest
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
test-strategy = "0.4.0"
thiserror = "2"
tokio = { version = "1.42.2", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = ["attributes"] }

[profile.release]
# Fail loudly on arithmetic bugs in production builds too.
overflow-checks = true
