[workspace]
resolver = "2"
# Add each crate here as it is written (e.g. "crates/primitives", "crates/modules/bank").
# Planned layout: TODO.md, Phase 1.
members = [
    "crates/interface",
    "crates/primitives",
    "crates/rockbound",
    "crates/state",
]
# Built separately: the SP1 guest with the SP1 toolchain, fuzz targets with nightly `cargo fuzz`.
exclude = ["zk/sp1-guest", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Selendra"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
non_ascii_idents = "deny" # Bad for readability and a homoglyph attack vector
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
inefficient_to_string = "deny"
map_flatten = "deny"
manual_ok_or = "deny"
doc_link_with_quotes = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
float_arithmetic = "deny"     # Native and zkVM execution must agree bit-for-bit
dbg_macro = "deny"
todo = "deny"
mem_forget = "deny"

[workspace.dependencies]
# Add `selendra-<name> = { path = "crates/<name>", default-features = false }` with each new crate.
selendra-interface = { path = "crates/interface", default-features = false }
selendra-primitives = { path = "crates/primitives", default-features = false }
selendra-state = { path = "crates/state", default-features = false }
# Vendored (Apache-2.0) with fixes: crates/rockbound/README.md.
rockbound = { path = "crates/rockbound" }

# Use the newest releases. Exception: crates whose output is consensus-critical (encoding,
# hashing, EVM) are pinned exactly (`=x.y.z`) and only upgraded deliberately.
# keccak256 (addresses, secp256k1 message hash) is consensus-critical: exact pin. The `tiny-keccak`
# feature selects the SP1-patched backend (the default backend is `sha3` 0.11, which SP1 does not patch).
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "tiny-keccak"] }
anyhow = "1.0.95"
arbitrary = { version = "1.3.2", features = ["derive"] }
async-trait = "0.1.81"
base64 = { version = "0.23", default-features = false, features = ["alloc"] } # strict (canonical) decoding; serde_with's Base64 ignores padding
bech32 = "0.12"
backon = { version = "1.5.1", default-features = false, features = ["tokio-sleep"] }
# Consensus-critical encoding: exact pin. `de_strict_order` makes `BTreeMap`/`BTreeSet` decoding
# reject unsorted or duplicate keys (otherwise one map has many encodings).
borsh = { version = "=1.8.1", features = ["derive", "de_strict_order"] }
bytes = { version = "1.10", default-features = false }
derive_more = { version = "2.0", default-features = false, features = ["std"] }
# zkVM-patched: SP1 6.x guest patches exact versions. Upgrade only together with the SP1 patches.
digest = { version = "0.10.7", default-features = false, features = ["alloc"] }
ed25519-consensus = { version = "=2.1.0", default-features = false, features = ["std"] }
# The curve crate behind ed25519-consensus 2.1.0 (same version, so no second copy); SP1-patched.
curve25519-dalek-ng = { version = "=4.1.1", default-features = false, features = ["u64_backend"] } # no `std`: it pulls getrandom
hex = "0.4.3"
# Signature validity is consensus-critical: exact pin. 0.14, not the 0.13.4 that SP1's secp256k1
# patch targets: 0.13 pulls crypto-bigint 0.5 with RUSTSEC-2026-0387 (timing leaks when signing).
# Re-check SP1 patch support in Phase 9. No `std`: it turns on `getrandom`, which must not reach
# the zk guest (randomness is enabled only by `selendra-primitives/native`).
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
# NOMT state tree: consensus-critical (node hashing, proof verification, state roots): exact pin.
# `nomt-core` is the no_std half the zk guest verifies with; no `std` (default) and no built-in
# hashers: `BinaryHasher<H>` works for any `Digest<OutputSize = U32>`, i.e. the SP1-patched sha2.
# Upgrade `nomt` and `nomt-core` together, and only deliberately.
nomt = { version = "=1.0.5", default-features = false, features = ["borsh"] }
nomt-core = { version = "=1.0.5", default-features = false, features = ["borsh"] }
parking_lot = "0.12.5"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = { version = "1.5", default-features = false, features = ["std", "alloc"] }
proptest-derive = "0.9"
quick_cache = "0.7"
rand_core = { version = "0.6", features = ["getrandom"] } # ed25519-consensus 2.1 uses rand_core 0.6
# Node-only (rockbound). Builds RocksDB from source: needs a C++ toolchain and libclang (bindgen).
# Only LZ4 compression (rockbound's default). `bindgen-runtime`: the build script loads libclang
# with `dlopen` (found through `LIBCLANG_PATH` or the usual locations) instead of linking it, so
# it runs without libclang on the loader path (cargo sets that path for build scripts itself).
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "bindgen-runtime"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0.208", default-features = false, features = ["alloc", "derive"] }
serde_with = { version = "3", default-features = false, features = ["alloc", "base64", "macros"] }
sha2 = { version = "=0.10.9", default-features = false } # zkVM-patched (SP1), see digest
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tempfile = "3.27"
test-strategy = "0.4.0"
thiserror = "2"
tokio = { version = "1.42.2", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = ["attributes"] }

[profile.release]
# Fail loudly on arithmetic bugs in production builds too.
overflow-checks = true
