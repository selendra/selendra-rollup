# cargo-audit config. cargo-audit scans every Cargo.lock entry, including optional
# dependencies that are never compiled; cargo-deny (`make deny`) checks the real
# dependency graph and is authoritative. Keep deny.toml's ignore list in sync.
[advisories]
ignore = [
  "RUSTSEC-2024-0436", # paste: unmaintained proc-macro via alloy-primitives (also ignored in deny.toml)
  # Lockfile-only: optional deps of alloy-primitives we don't enable; never compiled.
  # cargo-deny still fails if either becomes a real dependency.
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 via alloy-primitives' optional k256 0.13
  "RUSTSEC-2024-0388", # derivative via alloy-primitives' optional deps
]
