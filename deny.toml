# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason. Keep in sync with .cargo/audit.toml.
ignore = [
  # `paste` is unmaintained (no fix exists). Compile-time proc-macro only, no runtime code.
  # Pulled in by alloy-primitives, which the EVM (revm) needs anyway. Re-check when alloy drops it.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro via alloy-primitives, see comment" },
  # Via `nomt` 1.0.5 (exact pin, consensus-critical), a normal dependency of `selendra-db`: the
  # node's state trees (and a dev-dependency of selendra-state's NOMT tests). Node-only: the zk
  # guest uses only `nomt-core`, which pulls none of these, and nomt is not built for 32-bit
  # targets. `imbl` 3.0.0 (nomt's) requires `imbl-sized-chunks` 0.1, so the fixed 0.2.0 cannot
  # be used until nomt upgrades `imbl`.
  # RUSTSEC-2026-0292: `Chunk::{clear, drop_left, drop_right}` / `InlineArray::{clear, truncate}`
  # double-free only when an element's `Drop` panics. nomt 1.0.5 keeps in `imbl` collections only
  # `KeyPath`/`Key` ([u8; 32]), `u64`, `PageId` (an `ArrayVec<u8, _>`), `ValueChange` (`Vec<u8>`
  # and a hash), none of which has a `Drop` that can panic, and `Arc<BranchNode>` (beatree index),
  # whose last drop runs `FatPage::drop` -> `PagePool::dealloc`: a push onto a thread-local free
  # list (a `RefCell` borrow that `dealloc` never re-enters) and a move to the global list under
  # a lock. No panic there (allocation failure aborts). Re-check on every nomt upgrade.
  { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks double free needs a panicking element Drop; nomt's imbl elements have none (node-only via nomt in selendra-db), see comment" },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained: via nomt -> imbl, node-only (selendra-db), see comment" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained: via nomt (page cache hashing), node-only (selendra-db), see comment" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list anticipates upcoming dependencies; don't warn about unused entries.
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",            # Boost Software License — NOT Business Source License (BUSL-1.1)
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own crates are `publish = false`; their licensing is tracked in docs/provenance.md.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Prefer rustls; keep OpenSSL out of the tree.
deny = [{ name = "native-tls" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
# Git deps must be pinned to a commit: a moved tag/branch could inject code.
required-git-spec = "rev"
