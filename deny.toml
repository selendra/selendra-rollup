# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason. Keep in sync with .cargo/audit.toml.
ignore = [
  # `paste` is unmaintained (no fix exists). Compile-time proc-macro only, no runtime code.
  # Pulled in by alloy-primitives, which the EVM (revm) needs anyway. Re-check when alloy drops it.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro via alloy-primitives, see comment" },
  # Dev-only: `nomt` 1.0.5 is a dev-dependency of selendra-state (the test prover of the NOMT
  # verifier tests, 64-bit Unix only); never in a node or guest build. The guest uses only
  # `nomt-core`, which has none of these. They BLOCK `nomt` becoming a normal dependency (the
  # planned node-only db crate's NomtProverStorage): re-check, upgrade or patch before that.
  { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks double free on a panicking Drop: dev-only via nomt (test prover), see comment" },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained: dev-only via nomt -> imbl (test prover), see comment" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained: dev-only via nomt (test prover), see comment" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list anticipates upcoming dependencies; don't warn about unused entries.
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",            # Boost Software License — NOT Business Source License (BUSL-1.1)
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own crates are `publish = false`; their licensing is tracked in docs/provenance.md.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Prefer rustls; keep OpenSSL out of the tree.
deny = [{ name = "native-tls" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
# Git deps must be pinned to a commit: a moved tag/branch could inject code.
required-git-spec = "rev"
