[package]
name = "selendra-primitives"
description = "Selendra primitives: key types, signature schemes and account addresses (sel1 and 0x)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
arbitrary = { workspace = true }
bech32 = { workspace = true }
borsh = { workspace = true }
curve25519-dalek-ng = { workspace = true }
ed25519-consensus = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
rand_core = { workspace = true, optional = true }
schemars = { workspace = true }
selendra-interface = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
selendra-primitives = { path = ".", features = ["native"] }
# Only to check at compile time that the crypto specs hash with the state hasher (`StateHasher`).
# `native`: this crate's own dev-dependency above turns on `selendra-interface/native`.
selendra-state = { workspace = true, features = ["native"] }
serde_json = { workspace = true }

[features]
default = []
# Node-only code (never in the zk guest): private keys and key generation.
native = ["dep:rand_core", "k256/getrandom", "selendra-interface/native"]

[lints]
workspace = true
