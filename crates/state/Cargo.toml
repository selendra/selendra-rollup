[package]
name = "selendra-state"
description = "Selendra state: namespaces, storage keys/values, codecs, the StateValue/StateMap/StateVec containers, the Storage trait, witnesses and StateCheckpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true }
borsh = { workspace = true }
nomt-core = { workspace = true }
selendra-interface = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
test-strategy = { workspace = true }

# A real NOMT database for the verifier's tests (a test prover driving NOMT sessions). NOMT is
# Unix-only and is not tested on 32-bit, so those tests are skipped there (and on 32-bit targets
# such as `make test32`'s i686); everything else runs on every target.
[target.'cfg(all(unix, target_pointer_width = "64"))'.dev-dependencies]
nomt = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Node-only code (never in the zk guest): `NativeStorage` (accessory and historical reads),
# raw container APIs and storage proofs.
native = ["selendra-interface/native"]
# `NamespacedStateMap::arbitrary_state_map`.
arbitrary = ["dep:arbitrary"]

[lints]
workspace = true
