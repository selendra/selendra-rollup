[package]
name = "selendra-state"
description = "Selendra state: namespaces, storage keys/values, codecs, the StateValue/StateMap/StateVec containers, the Storage trait, witnesses and StateCheckpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true }
borsh = { workspace = true }
nomt-core = { workspace = true }
proptest = { workspace = true, optional = true }
rockbound = { workspace = true, optional = true }
selendra-interface = { workspace = true }
serde = { workspace = true }
# The state hasher (`StateHasher`): SHA-256, the exact version SP1's guest patches.
sha2 = { workspace = true }
test-strategy = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
test-strategy = { workspace = true }

# A real NOMT database for the verifier's tests (a test prover driving NOMT sessions). NOMT is
# Unix-only and is not tested on 32-bit, so those tests are skipped there (and on 32-bit targets
# such as `make test32`'s i686); everything else runs on every target.
[target.'cfg(all(unix, target_pointer_width = "64"))'.dev-dependencies]
nomt = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Node-only code (never in the zk guest): `NativeStorage` (accessory and historical reads),
# raw container APIs and storage proofs.
native = ["selendra-interface/native"]
# rockbound's key traits for `SlotKey` (the node's flat store keys values by `SlotKey`; the impls
# must live here, orphan rule). Separate from `native` so that `native` alone doesn't build RocksDB.
rockbound = ["native", "dep:rockbound"]
# `NamespacedStateMap::arbitrary_state_map`.
arbitrary = ["dep:arbitrary"]
# `test_utils` and `test_vectors`: helpers and known-answer vectors for the node's storage tests
# (`selendra-db` dev-dependency). Never in a node or guest build.
test-utils = ["dep:proptest", "dep:test-strategy"]

[lints]
workspace = true
