[package]
name = "rockbound"
description = "A low level interface transforming RocksDB into a type-oriented data store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
parking_lot = { workspace = true }
quick_cache = { workspace = true }
rocksdb = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Integration tests (tests/) use the `test-utils` items.
rockbound = { path = ".", features = ["test-utils"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Test helpers: `rockbound::test` fields and `VersionedDB::{commit, set_cache_size, cache_hits,
# cache_misses}`.
test-utils = ["quick_cache/stats"]

[lints]
workspace = true
