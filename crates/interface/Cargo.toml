[package]
name = "selendra-interface"
description = "Core traits every Selendra component is generic over: DA layer, state transition function, zkVM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
backon = { workspace = true, optional = true }
borsh = { workspace = true, features = ["bytes"] }
bytes = { workspace = true, features = ["serde"] }
derive_more = { workspace = true, features = ["add", "as_ref", "display", "from", "from_str"] }
digest = { workspace = true }
hex = { workspace = true }
# Proptest should be a dev-dependency, but those can't be optional
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
postcard = { workspace = true }
selendra-interface = { path = ".", features = ["native", "arbitrary"] }
serde_json = { workspace = true }
test-strategy = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }

[features]
default = []
# Node-only code (never compiled into the zk guest): DA clients, retries, async.
native = ["dep:async-trait", "dep:backon", "dep:tokio", "dep:tracing"]
arbitrary = ["dep:arbitrary", "dep:proptest", "dep:proptest-derive"]

[lints]
workspace = true
