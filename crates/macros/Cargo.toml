[package]
name = "selendra-macros"
description = "Selendra module system derives (ModuleInfo, ModuleEvent, ConsensusType), used through selendra-modules-api, which re-exports and documents them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
proc-macro = true

# Only what the derives use themselves: the code they generate names `::selendra_modules_api`
# (its `__private` module) and `::core`, never a dependency of the crate using them.
[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
