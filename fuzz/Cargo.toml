[package]
name = "selendra-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
borsh = { version = "=1.8.1", features = ["derive", "de_strict_order"] }
libfuzzer-sys = "0.4"
# The version `selendra-state` pins (its proofs are fuzzed through nomt-core directly too).
nomt-core = { version = "=1.0.5", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
selendra-interface = { path = "../crates/interface" }
selendra-mock-da = { path = "../crates/adapters/mock-da" }
selendra-mock-zkvm = { path = "../crates/adapters/mock-zkvm" }
selendra-modules-api = { path = "../crates/modules-api", features = ["test-utils"] }
selendra-primitives = { path = "../crates/primitives" }
selendra-state = { path = "../crates/state" }
# The test runtime's call messages and events derive them.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }

# Separate workspace: built with nightly + sanitizers by `cargo fuzz`, not by the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "addresses"
path = "fuzz_targets/addresses.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keys"
path = "fuzz_targets/keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mock_adapters"
path = "fuzz_targets/mock_adapters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modules_api_types"
path = "fuzz_targets/modules_api_types.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime_codec"
path = "fuzz_targets/runtime_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_types"
path = "fuzz_targets/safe_types.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_keys"
path = "fuzz_targets/state_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_witness"
path = "fuzz_targets/state_witness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transactions"
path = "fuzz_targets/transactions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_decoding"
path = "fuzz_targets/tx_decoding.rs"
test = false
doc = false
bench = false
