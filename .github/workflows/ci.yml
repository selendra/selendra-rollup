name: CI

on:
  push:
    branches: [main, dev]
  pull_request: {}
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Cargo rejects a workspace with no members: every job skips until the first crate exists.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  audit:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  udeps:
    runs-on: ubuntu-24.04
    if: hashFiles('crates/**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: "" # nightly may add new warnings unrelated to unused deps
